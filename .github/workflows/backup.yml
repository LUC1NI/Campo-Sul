name: Backup do banco

# Backup diário do Postgres (Supabase free não oferece backup baixável).
# Secrets necessários (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL — URL do "Session pooler" (porta 5432) do Supabase; runners do GitHub só têm IPv4
#   BACKUP_PASSPHRASE   — senha forte para criptografar o dump (guarde fora do GitHub também!)
#
# Restaurar: baixe o artifact em Actions → Backup do banco → execução → Artifacts, e:
#   gpg -d camposul-AAAA-MM-DD.dump.gpg > camposul.dump
#   pg_restore --clean --if-exists --no-owner -d "<URL do banco>" camposul.dump

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump + criptografia
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" && test -n "$PASS" || { echo "Configure os secrets BACKUP_DATABASE_URL e BACKUP_PASSPHRASE"; exit 1; }
          ARQ="camposul-$(date -u +%F).dump"
          # pg_dump 17 lê servidores 15–17 (Supabase). Só o schema public = dados do app.
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --format=custom --no-owner' > "$ARQ"
          test -s "$ARQ"
          echo "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$ARQ.gpg" "$ARQ"
          rm "$ARQ"
          echo "ARQ=$ARQ.gpg" >> "$GITHUB_ENV"
          ls -lh "$ARQ.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQ }}
          path: ${{ env.ARQ }}
          retention-days: 30
          compression-level: 0 # já comprimido + criptografado
